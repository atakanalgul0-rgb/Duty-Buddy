name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy app files into www
        run: |
          mkdir -p www
          for f in index.html sw.js localai.js manifest.webmanifest icon-180.png icon-192.png icon-512.png icon-maskable-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; else echo "missing: $f"; fi
          done
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DutyBuddy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
